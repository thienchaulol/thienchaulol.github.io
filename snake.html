<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1b3a;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --food: #f87171;
    --text: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(1200px 800px at 50% -10%, #1b1c3f, var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap {
    width: min(92vw, 480px);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 0 0 14px; font-size: 13px; opacity: .65; }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 15px;
    font-weight: 600;
  }
  .hud .pill {
    background: var(--panel);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border-radius: 16px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    background: #0c0d22;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 12px;
    border-radius: 10px;
    background: rgba(8,9,26,.82);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 24px; }
  .overlay p { margin: 0; opacity: .75; font-size: 14px; line-height: 1.5; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 11px 26px;
    font-size: 15px;
    font-weight: 700;
    color: #04210f;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: transform .08s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  .hint { margin-top: 12px; font-size: 12px; opacity: .5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SNAKE</h1>
  <p class="sub">Arrow keys / WASD &middot; swipe on mobile</p>
  <div class="hud">
    <span class="pill">Score: <span id="score">0</span></span>
    <span class="pill">Best: <span id="best">0</span></span>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Ready?</h2>
      <p id="ovText">Eat the food, grow longer, and don't hit the walls or yourself.</p>
      <button id="startBtn">Play</button>
    </div>
  </div>
  <p class="hint">Tip: press Space to pause/resume</p>
</div>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;
  const CELL = canvas.width / GRID;
  let snake, dir, nextDir, food, score, best, loop, speed, running, paused;

  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 130;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    while (true) {
      const f = {x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0};
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    clearInterval(loop);
    loop = setInterval(tick, speed);
  }

  function gameOver() {
    running = false;
    clearInterval(loop);
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', String(best));
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'Game Over';
    ovText.textContent = 'You scored ' + score + '. ' + (score >= best ? 'New best!' : 'Best: ' + best);
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function tick() {
    if (paused) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (speed > 60 && score % 3 === 0) {
        speed -= 6;
        clearInterval(loop);
        loop = setInterval(tick, speed);
      }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // food
    ctx.fillStyle = '#f87171';
    roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 6);
    ctx.fill();
    // snake
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#22d3ee' : 'rgb(' + (74 - t * 30) + ',' + (222 - t * 80) + ',' + (128 - t * 40) + ')';
      roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 5);
      ctx.fill();
    }
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // no reversing
    nextDir = {x, y};
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { setDir(0, -1); e.preventDefault(); }
    else if (k === 'arrowdown' || k === 's') { setDir(0, 1); e.preventDefault(); }
    else if (k === 'arrowleft' || k === 'a') { setDir(-1, 0); e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { setDir(1, 0); e.preventDefault(); }
    else if (k === ' ') { if (running) { paused = !paused; } e.preventDefault(); }
  });

  // touch / swipe
  let tStart = null;
  canvas.addEventListener('touchstart', (e) => {
    tStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  canvas.addEventListener('touchmove', (e) => {
    if (!tStart) return;
    const dx = e.touches[0].clientX - tStart.x;
    const dy = e.touches[0].clientY - tStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    tStart = null;
    e.preventDefault();
  }, {passive: false});

  startBtn.addEventListener('click', start);
  draw();
})();
</script>
</body>
</html>
