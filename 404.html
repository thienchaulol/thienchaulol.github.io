<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBFAF8">
  <meta name="robots" content="noindex">
  <title>Page not found — Mr. Chau</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F6F5C'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='20' fill='%23FBFAF8' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <style>
    :root{
      --ink:#1A1A18;
      --ink-soft:#403D38;
      --muted:#6B6862;
      --paper:#FBFAF8;
      --surface-warm:#F4F1EB;
      --rule:#E4E0D8;
      --accent:#1F6F5C;
      --accent-deep:#175447;
      --accent-wash:#EAF2EF;
      --wrap:1120px;
      --r:8px;
      --serif:ui-serif, Georgia, "Times New Roman", serif;
      --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px/1.6 var(--sans);color:var(--ink-soft);background:var(--paper);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{color:var(--accent-deep);text-decoration:underline}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
    .wrap{max-width:var(--wrap);margin:0 auto;padding:0 32px;width:100%}
    .nav{border-bottom:1px solid var(--rule)}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
    .brand{font:600 1.15rem var(--serif);color:var(--ink)}
    .brand:hover{color:var(--ink);text-decoration:none}
    main{flex:1;display:flex;align-items:center;position:relative;overflow:hidden;padding:72px 0}
    main::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
      background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
      background-size:28px 28px;
      mask-image:radial-gradient(90% 80% at 70% 20%,#000 0%,transparent 70%);
      -webkit-mask-image:radial-gradient(90% 80% at 70% 20%,#000 0%,transparent 70%);
    }
    .content{position:relative;max-width:620px}
    .eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin:0 0 16px}
    h1{font:600 clamp(2.3rem,4.6vw,3.25rem)/1.2 var(--serif);color:var(--ink);letter-spacing:-.01em;margin:0 0 16px}
    .lede{font-size:1.125rem;color:var(--muted);margin:0 0 32px}
    .actions{display:flex;flex-wrap:wrap;gap:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border-radius:var(--r);font:600 1rem var(--sans);border:1px solid transparent;transition:background-color .2s,border-color .2s}
    .btn-primary{background:var(--accent);color:var(--on-accent)}
    .btn-primary:hover{background:var(--accent-deep);color:var(--on-accent);text-decoration:none}
    .btn-ghost{color:var(--ink);border-color:var(--rule)}
    .btn-ghost:hover{background:var(--surface-warm);color:var(--ink);text-decoration:none;border-color:var(--hover-border)}
    footer{background:var(--footer-bg);color:rgba(255,255,255,.72);padding:25px 0;text-align:center;font-size:.86rem}
    @media(max-width:700px){.wrap{padding:0 20px}.btn{width:100%}}
  </style>
</head>
<body>
  <nav class="nav" aria-label="Primary">
    <div class="wrap nav-inner">
      <a href="/" class="brand">Mr.&nbsp;Chau</a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode"><svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 10.6A6.6 6.6 0 0 1 7.4 2.8a6.6 6.6 0 1 0 7.8 7.8z"/></svg><svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M9 1.6v1.6M9 14.8v1.6M1.6 9h1.6M14.8 9h1.6M3.8 3.8l1.1 1.1M13.1 13.1l1.1 1.1M3.8 14.2l1.1-1.1M13.1 4.9l1.1-1.1"/></svg></button>
    </div>
  </nav>
  <main id="main">
    <div class="wrap">
      <div class="content">
        <p class="eyebrow">Error 404</p>
        <h1>This page doesn&rsquo;t exist.</h1>
        <p class="lede">The link may be old, or the address may have a typo. Here are the places most people are looking for.</p>
        <div class="actions">
          <a href="/" class="btn btn-primary">Go to the main site</a>
          <a href="/sat-practice.html" class="btn btn-ghost">Practice SAT</a>
          <a href="/#booking" class="btn btn-ghost">Book a call</a>
        </div>
      </div>
    </div>
  </main>
  <footer><div class="wrap">&copy; 2026 Thien Chau &middot; Math &amp; Computer Science Tutoring</div></footer>
</body>
</html>
